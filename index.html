<html lang="en">

<title>Inkbow — Rainbow text for BBCode, HTML, CSS &amp; ANSI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EFF9;--panel:#fff;--ink:#16123A;--mute:#6B668F;--line:#DDD9F0;--acc:#5B3DF5;--stage:#fff;--code:#F7F6FD;color-scheme:light}
:root[data-theme=dark]{--bg:#0F0D1F;--panel:#18152E;--ink:#ECE9FF;--mute:#9791C4;--line:#2D2951;--acc:#8F7BFF;--stage:#0B0A17;--code:#110F24;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;max-width:1180px;margin:0 auto;padding:20px 20px 0}
.brand{background:linear-gradient(90deg,#FF512F,#DD2476,#5B3DF5);-webkit-background-clip:text;background-clip:text;color:transparent}
footer{max-width:1180px;margin:0 auto;padding:4px 20px 28px;color:var(--mute);font-size:.9rem}
footer b{color:var(--ink);font-weight:600}
h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
main{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}.sticky{position:static!important}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:1rem;font-weight:600}
.sticky{position:sticky;top:16px}
textarea,select,input[type=text]{width:100%;font:inherit;color:inherit;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:96px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0}
.chips span,button{display:inline-block;font:inherit;font-size:.9rem;color:var(--ink);background:var(--code);border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer}
.chips input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}
.chips input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.stop{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.stop input[type=color]{width:42px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
.stop input[type=text]{font-family:'JetBrains Mono',monospace;width:110px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row>*{flex:0 0 auto}.row select{width:auto}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.presets button{width:64px;height:26px;padding:0;border-radius:8px}
.stage{min-height:150px;border-radius:12px;padding:22px;display:grid;place-items:center;text-align:center;overflow:auto;word-break:break-word;font-size:2rem;white-space:pre-wrap;background:var(--stage);border:1px solid var(--line)}
.stage.light{background:#fff}.stage.dark{background:#0B0A17}
.stage.check{background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/20px 20px}
.tabs{margin:14px 0 8px}
pre,output{display:block}
#out{width:100%;min-height:150px;font:13px/1.55 'JetBrains Mono',monospace}
.meta{color:var(--mute);font-size:.85rem;margin:6px 0 0}
.hide{display:none}
#inner{max-width:100%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.25}
.hud{position:relative;height:34px;border-radius:10px;border:1px solid var(--line);margin:4px 0 24px}
.hud i{position:absolute;top:100%;width:14px;height:14px;margin:4px 0 0 -7px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--mute)}
.rng{display:grid;grid-template-columns:100px 1fr 38px;gap:8px;align-items:center;margin-bottom:6px;font-size:.9rem}
.rng input{width:100%;accent-color:var(--acc)}
input[type=number]{font:inherit;color:inherit;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:6px 8px;width:64px}
#stops:not([data-fx=gradient]):not([data-fx=mirror]):not([data-fx=wave]) .pos{display:none}
body{background:radial-gradient(900px 420px at 85% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent) fixed,var(--bg)}
.card{box-shadow:0 1px 2px rgba(20,10,60,.05),0 10px 28px -14px rgba(20,10,60,.18)}
.card h2{display:flex;align-items:center;gap:9px}
.card h2 i{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.ic{width:16px;height:16px;flex:none}
button .ic{width:15px;height:15px;vertical-align:-3px;margin-right:6px}
button:only-child .ic:only-child,.stop button .ic{margin:0}
button,.chips span{transition:border-color .15s,transform .1s,background .15s}
button:active{transform:translateY(1px)}
.presets button:hover{transform:scale(1.06)}
.logo{display:flex;align-items:center;gap:12px}.tag{color:var(--mute);font-size:.85rem;margin-top:-2px}
#theme{display:grid;place-items:center;width:38px;height:38px;padding:0;border-radius:12px}#theme .ic{margin:0;width:18px;height:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stage{min-height:180px}
footer{border-top:1px solid var(--line);margin-top:8px;padding-top:16px}
</style>
</head>
<body>
<header><div class="logo"><svg width="38" height="38" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="lg"><stop offset="0" stop-color="#FF512F"/><stop offset=".5" stop-color="#DD2476"/><stop offset="1" stop-color="#5B3DF5"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#lg)"/><circle cx="32" cy="18" r="5" fill="#fff"/><rect x="27.5" y="27" width="9" height="22" rx="4.5" fill="#fff"/></svg><div><h1 class="brand">Inkbow</h1><div class="tag">Paint your text with color</div></div></div><button id="theme" aria-label="Toggle theme"></button></header>
<main>
<section>
  <div class="card"><h2><i data-ic="pen"></i>Your text</h2><textarea id="text" spellcheck="false"></textarea>
    <div class="row"><label><input type="checkbox" id="perWord"> Color per word</label><label><input type="checkbox" id="opt" checked> Merge identical colors</label></div></div>
  <div class="card"><h2><i data-ic="sparkles"></i>Color effect</h2><div class="chips" id="effects"></div>
    <div id="stopsBox" style="margin-top:14px"><div class="hud" id="hud"></div><div id="stops" data-fx="gradient"></div><div class="row" style="margin-top:0"><button id="add"><i data-ic="plus"></i>Add color</button><button id="rev"><i data-ic="swap"></i>Reverse</button></div>
    <div class="presets" id="presets" aria-label="Presets"></div><div class="row" id="harm"><button data-h="comp">Complementary</button><button data-h="ana">Analogous</button><button data-h="tri">Triadic</button><button data-h="rand" class="p"><i data-ic="shuffle"></i>Random palette</button></div></div>
    <div class="row hide" id="repBox"><label>Repeat <input type="number" id="rep" min="1" max="12"> times back and forth</label></div><div class="row hide" id="rerollBox"><button id="reroll" class="p"><i data-ic="shuffle"></i>Shuffle colors</button></div></div>
  <div class="card"><h2><i data-ic="type"></i>Text style</h2>
    <div class="grid2"><select id="font" aria-label="Font"></select><select id="size" aria-label="Size"></select><select id="ls" aria-label="Letter spacing"></select><select id="cs" aria-label="Letter case"></select><select id="uni" aria-label="Unicode font style" style="grid-column:1/-1"></select></div>
    <div class="chips" style="margin-top:10px" id="styles"></div></div>
  <div class="card"><h2><i data-ic="sliders"></i>Color adjust</h2>
    <label class="rng">Hue shift<input type="range" id="a_h" min="-180" max="180"><output id="o_h"></output></label>
    <label class="rng">Saturation<input type="range" id="a_sa" min="-100" max="100"><output id="o_sa"></output></label>
    <label class="rng">Lightness<input type="range" id="a_li" min="-50" max="50"><output id="o_li"></output></label>
    <button id="rst"><i data-ic="swap"></i>Reset</button></div>
</section>
<section class="sticky">
  <div class="card"><h2><i data-ic="eye"></i>Preview</h2><div class="stage" id="stage"></div>
    <div class="chips" style="margin-top:10px" id="bgs"></div></div>
  <div class="card"><h2><i data-ic="code"></i>Code</h2><div class="chips tabs" id="fmts"></div>
    <textarea id="out" readonly aria-label="Generated code"></textarea>
    <div class="row"><button class="p" id="copy"><i data-ic="copy"></i>Copy code</button><button id="rich"><i data-ic="clip"></i>Copy rich text</button><button id="share"><i data-ic="share"></i>Copy share link</button><span class="meta" id="meta"></span></div></div>
</section>
</main>
<footer>Made by <b>AziF</b> · MIT licensed · Inkbow turns plain text into colored text for forums, sites, terminals and games.</footer>

  if(ws(c)){prev=false;if(c=='\n')ln++;if(S.opt&&out.length&&out[out.length-1].c)out[out.length-1].t+=c;else out.push({t:c,c:null});continue}
  if(!(S.perWord&&prev))k++;prev=true;
  const col=adj(S.effect=='line'?S.stops[ln%S.stops.length]:colorAt(k,n,n>1?k/(n-1):0)),l=out[out.length-1];
  if(S.opt&&l&&(l.c===col))l.t+=c;else if(S.opt&&l&&!l.c&&/^\s+$/.test(l.t)&&out.length>1&&out[out.length-2].c===col){out[out.length-2].t+=l.t+c;out.pop()}else out.push({t:c,c:col})}
 return out}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function styleCss(){let c='';if(S.font)c+=`font-family:${S.font};`;if(S.size)c+=`font-size:${S.size}px;`;if(S.ls)c+=`letter-spacing:${S.ls}px;`;if(S.b)c+='font-weight:bold;';if(S.i)c+='font-style:italic;';const d=[S.u&&'underline',S.s&&'line-through'].filter(Boolean).join(' ');if(d)c+=`text-decoration:${d};`;return c}
function gen(r){
 const f=S.fmt,wr=(o,t)=>{for(const[k,a,b]of t)if(S[k])o=a+o+b;return o},br=s=>esc(s).replace(/\n/g,'<br>');
 if(f=='bbcode'){let o=r.map(x=>x.c?`[color=${x.c}]${x.t}[/color]`:x.t).join('');
  if(S.s)o=`[s]${o}[/s]`;if(S.u)o=`[u]${o}[/u]`;if(S.i)o=`[i]${o}[/i]`;if(S.b)o=`[b]${o}[/b]`;
  if(S.size)o=`[size=${S.size}]${o}[/size]`;if(S.font)o=`[font=${S.font}]${o}[/font]`;return o}
 if(f=='html'){let o=r.map(x=>{const t=esc(x.t).replace(/\n/g,'<br>');return x.c?`<span style="color:${x.c};${S.g?`text-shadow:0 0 .35em ${x.c};`:''}">${t}</span>`:t}).join('');const c=styleCss();return c?`<span style="${c}">${o}</span>`:o}
 if(f=='font')return wr(r.map(x=>x.c?`<font color="${x.c}">${br(x.t)}</font>`:br(x.t)).join(''),HT);
 if(f=='unity')return wr(r.map(x=>x.c?`<color=${x.c}>${x.t}</color>`:x.t).join(''),HT);
 const MM=[['s','<strikethrough>','</strikethrough>'],['u','<underlined>','</underlined>'],['i','<italic>','</italic>'],['b','<bold>','</bold>']];
 if(f=='mini')return wr(r.map(x=>x.c?`<${x.c}>${x.t}`:x.t).join(''),MM);
 if(f=='minigrad'){if(!SMOOTH.includes(S.effect))return'# MiniMessage gradient needs a smooth effect: Gradient, Middle gradient, Repeating wave or Rainbow.';return wr(`<gradient:${[0,1,2,3,4,5,6,7,8].map(i=>rampAt(i/8)).join(':')}>${txt()}</gradient>`,MM)}
 if(f=='latex')return wr(r.map(x=>{const t=lx(x.t);return x.c?`\\textcolor[HTML]{${x.c.slice(1)}}{${t}}`:t}).join(''),[['s','\\sout{','}'],['u','\\underline{','}'],['i','\\textit{','}'],['b','\\textbf{','}']]);
 if(f=='mcjson')return JSON.stringify(['',...r.filter(x=>x.t).map(x=>{const o={text:x.t};if(x.c)o.color=x.c.toLowerCase();if(S.b)o.bold=true;if(S.i)o.italic=true;if(S.u)o.underlined=true;if(S.s)o.strikethrough=true;return o})]);
 if(f=='discord')return '```ansi\n'+r.map(x=>x.c?`\x1b[${S.b?'1;':''}${S.u?'4;':''}${near(x.c)}m${x.t}`:x.t).join('')+'\x1b[0m\n```';
 if(f=='css'){if(!SMOOTH.includes(S.effect))return'/* The CSS gradient export needs a smooth effect: Gradient, Middle gradient, Repeating wave or Rainbow. */';
  const pts=Array.from({length:33},(_,i)=>rampAt(i/32));
  return `<span style="background:linear-gradient(90deg,${pts.join(',')});-webkit-background-clip:text;background-clip:text;color:transparent;${styleCss()}">${esc(txt()).replace(/\n/g,'<br>')}</span>`}
 if(f=='ansi')return r.map(x=>x.c?x.t.replace(/\n/g,'\n').split('').map(c=>{const[a,b,d]=h2r(x.c);return c=='\n'?c:`\\x1b[${S.b?'1;':''}${S.i?'3;':''}${S.u?'4;':''}38;2;${a};${b};${d}m${c}\\x1b[0m`}).join(''):x.t).join('');
 return r.map(x=>x.c?Array.from(x.t).map(c=>`&#${x.c.slice(1)}${S.b?'&l':''}${S.i?'&o':''}${S.u?'&n':''}${S.s?'&m':''}${c}`).join(''):x.t).join('')}
function render(){
 const r=runs();$('#out').value=gen(r);
 $('#stage').innerHTML='<div id="inner">'+(r.map(x=>{const t=esc(x.t);return x.c?`<span style="color:${x.c}${S.g?`;text-shadow:0 0 .35em ${x.c}`:''}">${t}</span>`:t}).join('')||'<span style="opacity:.4">Type something…</span>')+'</div>';
 $('#inner').style.cssText=styleCss();$('#stage').className='stage '+(S.bg=='auto'?'':S.bg);
 $('#meta').textContent=`${Array.from(S.text).length} chars · ${$('#out').value.length} code chars`;
 $('#stopsBox').classList.toggle('hide',['random','rainbow'].includes(S.effect));
 $('#rerollBox').classList.toggle('hide',S.effect!='random');
 $('#add').classList.toggle('hide',S.effect=='solid');
 $('#repBox').classList.toggle('hide',S.effect!='wave');$('#stops').dataset.fx=S.effect;drawHud();
 [['h','o_h'],['sa','o_sa'],['li','o_li']].forEach(([k,id])=>$('#'+id).textContent=S[k]);
 try{history.replaceState(null,'','#'+btoa(unescape(encodeURIComponent(JSON.stringify(S,['text','effect','stops','perWord','opt','font','size','b','i','u','s','fmt','bg','seed','cs','uni','ls','g','sp','pos','rep','h','sa','li'])))))}catch(e){}}
function chips(el,name,map,key){$(el).innerHTML=Object.entries(map).map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}"${S[key]==v?' checked':''}><span>${l}</span></label>`).join('');
 $(el).onchange=e=>{S[key]=e.target.value;render()}}
function drawHud(){const st=S.stops,p=posOf(),hard=['alt','solid','line'].includes(S.effect),s2=S.effect=='solid'?[st[0]]:st;
 $('#hud').style.background='linear-gradient(90deg,'+(hard?s2.map((c,i)=>`${adj(c)} ${i/s2.length*100}% ${(i+1)/s2.length*100}%`).join(','):Array.from({length:33},(_,i)=>rampAt(i/32)).join(','))+')';
 $('#hud').innerHTML=['gradient','wave'].includes(S.effect)?st.map((c,i)=>`<i style="left:${p[i]*100}%;background:${c}"></i>`).join(''):''}
function drawStops(){const p=posOf(),q=$('#stops');
 q.innerHTML=S.stops.map((c,i)=>`<div class="stop"><input type="color" value="${c}" data-i="${i}" aria-label="Color ${i+1}"><input type="text" data-i="${i}" value="${c}" maxlength="7" aria-label="Hex ${i+1}"><input class="pos" type="number" min="0" max="100" data-p="${i}" value="${Math.round(p[i]*100)}" aria-label="Position ${i+1} percent" title="Position %">${'EyeDropper' in window?`<button data-e="${i}" title="Pick from screen" aria-label="Eyedropper">${ic('pipette')}</button>`:''}${S.stops.length>2?`<button data-x="${i}" aria-label="Remove">${ic('x')}</button>`:''}</div>`).join('');
 q.querySelectorAll('[data-i]').forEach(el=>el.oninput=()=>{const v=el.value;if(/^#[0-9a-f]{6}$/i.test(v)){S.stops[el.dataset.i]=v.toUpperCase();el.parentNode.querySelectorAll('[data-i]').forEach(o=>{if(o!==el)o.value=v});render()}});
 q.querySelectorAll('[data-p]').forEach(el=>el.oninput=()=>{if(S.pos.length!=S.stops.length)S.pos=posOf();S.pos[el.dataset.p]=Math.max(0,Math.min(100,+el.value||0))/100;render()});
 q.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{S.stops.splice(b.dataset.x,1);S.pos=[];drawStops();render()});
 q.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>new EyeDropper().open().then(r=>{S.stops[b.dataset.e]=r.sRGBHex.toUpperCase();drawStops();render()}).catch(()=>{}))}
function init(){
 try{Object.assign(S,JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1))))))}catch(e){}
 $('#text').value=S.text;$('#perWord').checked=S.perWord;$('#opt').checked=S.opt;

 $('#size').innerHTML=SIZES.map(f=>`<option value="${f}">${f?f+' px':'Default size'}</option>`).join('');$('#size').value=S.size;
 $('#styles').innerHTML=[['b','Bold'],['i','Italic'],['u','Underline'],['s','Strikethrough'],['g','Glow'],['sp','Spaced out']].map(([k,l])=>`<label><input type="checkbox" data-k="${k}"${S[k]?' checked':''}><span>${l}</span></label>`).join('');
 $('#styles').onchange=e=>{S[e.target.dataset.k]=e.target.checked?1:0;render()};
 chips('#effects','fx',EFFECTS,'effect');chips('#fmts','fm',FORMATS,'fmt');chips('#bgs','bg',BGS,'bg');
 $('#presets').innerHTML=Object.entries(PRESETS).map(([n,c])=>`<button title="${n}" aria-label="${n}" style="background:linear-gradient(90deg,${c})"></button>`).join('');
 $('#presets').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.stops=[...PRESETS[b.title]];S.pos=[];if(S.effect=='random'||S.effect=='rainbow'||S.effect=='solid'){S.effect='gradient';chips('#effects','fx',EFFECTS,'effect')}drawStops();render()};
 $('#text').oninput=e=>{S.text=e.target.value;render()};
 $('#perWord').onchange=e=>{S.perWord=e.target.checked;render()};$('#opt').onchange=e=>{S.opt=e.target.checked;render()};
 $('#ls').innerHTML=[0,1,2,4,8].map(v=>`<option value="${v}">${v?v+' px spacing':'Normal spacing'}</option>`).join('');$('#ls').value=S.ls;
 $('#cs').innerHTML=Object.entries(CASES).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');$('#cs').value=S.cs;
 $('#uni').innerHTML=Object.entries(UNIS).map(([v,l])=>`<option value="${v}">${l} ${v?uni('Abc',v):''}</option>`).join('');$('#uni').value=S.uni;
 ['ls','cs','uni'].forEach(k=>$('#'+k).onchange=e=>{S[k]=k=='ls'?+e.target.value:e.target.value;render()});
 $('#font').onchange=e=>{S.font=e.target.value;render()};$('#size').onchange=e=>{S.size=e.target.value;render()};
 $('#add').onclick=()=>{S.pos=[];S.stops.push(r2h([Math.random()*255,Math.random()*255,Math.random()*255]));drawStops();render()};
 $('#rev').onclick=()=>{S.stops.reverse();S.pos=[];drawStops();render()};

 const cp2=(txt,b)=>navigator.clipboard.writeText(txt).then(()=>{const o=b.innerHTML;b.innerHTML=ic('check')+'Copied!';setTimeout(()=>b.innerHTML=o,1200)});

 $('#theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'light':'dark';tIcon()};

 $('#rep').value=S.rep;$('#rep').oninput=e=>{S.rep=Math.max(1,Math.min(12,+e.target.value||1));render()};
 [['h','a_h'],['sa','a_sa'],['li','a_li']].forEach(([k,id])=>{const el=$('#'+id);el.value=S[k];el.oninput=()=>{S[k]=+el.value;render()}});
 $('#rst').onclick=()=>{S.h=S.sa=S.li=0;['a_h','a_sa','a_li'].forEach(id=>$('#'+id).value=0);render()};
