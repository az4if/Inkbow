<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inkbow — Rainbow text for BBCode, HTML, CSS &amp; ANSI</title>
<meta name="author" content="AziF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cdefs%3E%3ClinearGradient id=%27g%27%3E%3Cstop offset=%270%27 stop-color=%27%23FF512F%27/%3E%3Cstop offset=%27.5%27 stop-color=%27%23DD2476%27/%3E%3Cstop offset=%271%27 stop-color=%27%235B3DF5%27/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27url(%23g)%27/%3E%3Ctext x=%2732%27 y=%2748%27 font-size=%2742%27 font-family=%27Georgia,serif%27 font-weight=%27bold%27 text-anchor=%27middle%27 fill=%27white%27%3Ei%3C/text%3E%3C/svg%3E">
<meta name="description" content="Inkbow by AziF: paint text with gradients and rainbows, then export as BBCode, HTML, CSS, ANSI or Minecraft codes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EFF9;--panel:#fff;--ink:#16123A;--mute:#6B668F;--line:#DDD9F0;--acc:#5B3DF5;--stage:#fff;--code:#F7F6FD;color-scheme:light}
:root[data-theme=dark]{--bg:#0F0D1F;--panel:#18152E;--ink:#ECE9FF;--mute:#9791C4;--line:#2D2951;--acc:#8F7BFF;--stage:#0B0A17;--code:#110F24;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Bricolage Grotesque',system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;max-width:1180px;margin:0 auto;padding:20px 20px 0}
.brand{background:linear-gradient(90deg,#FF512F,#DD2476,#5B3DF5);-webkit-background-clip:text;background-clip:text;color:transparent}
footer{max-width:1180px;margin:0 auto;padding:4px 20px 28px;color:var(--mute);font-size:.9rem}
footer b{color:var(--ink);font-weight:600}
h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
main{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}.sticky{position:static!important}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{margin:0 0 10px;font-size:1rem;font-weight:600}
.sticky{position:sticky;top:16px}
textarea,select,input[type=text]{width:100%;font:inherit;color:inherit;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:96px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0}
.chips span,button{display:inline-block;font:inherit;font-size:.9rem;color:var(--ink);background:var(--code);border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer}
.chips input:checked+span{background:var(--acc);border-color:var(--acc);color:#fff}
.chips input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
.stop{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.stop input[type=color]{width:42px;height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
.stop input[type=text]{font-family:'JetBrains Mono',monospace;width:110px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.row>*{flex:0 0 auto}.row select{width:auto}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.presets button{width:64px;height:26px;padding:0;border-radius:8px}
.stage{min-height:150px;border-radius:12px;padding:22px;display:grid;place-items:center;text-align:center;overflow:auto;word-break:break-word;font-size:2rem;white-space:pre-wrap;background:var(--stage);border:1px solid var(--line)}
.stage.light{background:#fff}.stage.dark{background:#0B0A17}
.stage.check{background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/20px 20px}
.tabs{margin:14px 0 8px}
pre,output{display:block}
#out{width:100%;min-height:150px;font:13px/1.55 'JetBrains Mono',monospace}
.meta{color:var(--mute);font-size:.85rem;margin:6px 0 0}
.hide{display:none}
</style>
</head>
<body>
<header><h1 class="brand">Inkbow</h1><button id="theme" aria-label="Toggle theme">Theme</button></header>
<main>
<section>
  <div class="card"><h2>Your text</h2><textarea id="text" spellcheck="false"></textarea>
    <div class="row"><label><input type="checkbox" id="perWord"> Color per word</label><label><input type="checkbox" id="opt" checked> Merge identical colors</label></div></div>
  <div class="card"><h2>Color effect</h2><div class="chips" id="effects"></div>
    <div id="stopsBox" style="margin-top:14px"><div id="stops"></div><div class="row" style="margin-top:0"><button id="add">+ Add color</button><button id="rev">Reverse</button></div>
    <div class="presets" id="presets" aria-label="Presets"></div></div>
    <div class="row hide" id="rerollBox"><button id="reroll" class="p">Shuffle colors</button></div></div>
  <div class="card"><h2>Text style</h2>
    <div class="row" style="margin-top:0"><select id="font" aria-label="Font"></select><select id="size" aria-label="Size"></select></div>
    <div class="chips" style="margin-top:10px" id="styles"></div></div>
</section>
<section class="sticky">
  <div class="card"><h2>Preview</h2><div class="stage" id="stage"></div>
    <div class="chips" style="margin-top:10px" id="bgs"></div></div>
  <div class="card"><h2>Code</h2><div class="chips tabs" id="fmts"></div>
    <textarea id="out" readonly aria-label="Generated code"></textarea>
    <div class="row"><button class="p" id="copy">Copy code</button><button id="share">Copy share link</button><span class="meta" id="meta"></span></div></div>
</section>
</main>
<footer>Made by <b>AziF</b> · MIT licensed · Inkbow turns plain text into colored text for forums, sites, terminals and games.</footer>
<script>
const $=s=>document.querySelector(s);
const EFFECTS={gradient:'Gradient',mirror:'Middle gradient',alt:'Alternating',solid:'Solid',random:'Random',rainbow:'Rainbow'};
const FORMATS={bbcode:'BBCode',html:'HTML',css:'CSS gradient',ansi:'ANSI terminal',mc:'Minecraft'};
const FONTS=['','Arial','Verdana','Georgia','Times New Roman','Courier New','Trebuchet MS','Comic Sans MS','Impact'];
const SIZES=['','12','16','24','32','48','64'];
const BGS={auto:'Theme',light:'Light',dark:'Dark',check:'Transparent'};
const PRESETS={Sunset:['#FF512F','#F09819','#DD2476'],Ocean:['#00C6FF','#0072FF'],Neon:['#F72585','#7209B7','#4CC9F0'],Forest:['#11998E','#38EF7D'],Candy:['#FF9A9E','#FECFEF','#A18CD1'],Fire:['#F83600','#F9D423'],Mono:['#111111','#999999']};
const S={text:'Hello world!',effect:'gradient',stops:['#FF0000','#0000FF'],perWord:false,opt:true,font:'',size:'',b:0,i:0,u:0,s:0,fmt:'bbcode',bg:'auto',seed:7};
const h2r=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const r2h=a=>'#'+a.map(v=>Math.round(v).toString(16).padStart(2,'0')).join('').toUpperCase();
function sample(st,t){if(st.length==1)return st[0];const x=t*(st.length-1),i=Math.min(Math.floor(x),st.length-2),f=x-i,a=h2r(st[i]),b=h2r(st[i+1]);return r2h(a.map((v,k)=>v+(b[k]-v)*f))}
function hsl(h,s,l){h%=360;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1))};return r2h([f(0)*255,f(8)*255,f(4)*255])}
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function colorAt(k,n,t){const st=S.stops;switch(S.effect){
 case'gradient':return sample(st,t);
 case'mirror':return sample(st,1-Math.abs(2*t-1));
 case'alt':return st[k%st.length];
 case'solid':return st[0];
 case'rainbow':return hsl(n>1?k/n*360:0,1,.5);
 case'random':return S.rnd[k]||(S.rnd[k]=hsl(S.r()*360,.85,.5))}}
function runs(){
 const ch=Array.from(S.text),ws=c=>/\s/.test(c);let n=0,prev=false;
 ch.forEach(c=>{if(!ws(c)){if(!(S.perWord&&prev))n++;prev=true}else prev=false});
 S.r=rng(S.seed);S.rnd=[];
 let k=-1;prev=false;const out=[];
 for(const c of ch){
  if(ws(c)){prev=false;if(S.opt&&out.length&&out[out.length-1].c)out[out.length-1].t+=c;else out.push({t:c,c:null});continue}
  if(!(S.perWord&&prev))k++;prev=true;
  const col=colorAt(k,n,n>1?k/(n-1):0),l=out[out.length-1];
  if(S.opt&&l&&(l.c===col))l.t+=c;else if(S.opt&&l&&!l.c&&/^\s+$/.test(l.t)&&out.length>1&&out[out.length-2].c===col){out[out.length-2].t+=l.t+c;out.pop()}else out.push({t:c,c:col})}
 return out}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function styleCss(){let c='';if(S.font)c+=`font-family:${S.font};`;if(S.size)c+=`font-size:${S.size}px;`;if(S.b)c+='font-weight:bold;';if(S.i)c+='font-style:italic;';const d=[S.u&&'underline',S.s&&'line-through'].filter(Boolean).join(' ');if(d)c+=`text-decoration:${d};`;return c}
function gen(r){
 const f=S.fmt;
 if(f=='bbcode'){let o=r.map(x=>x.c?`[color=${x.c}]${x.t}[/color]`:x.t).join('');
  if(S.s)o=`[s]${o}[/s]`;if(S.u)o=`[u]${o}[/u]`;if(S.i)o=`[i]${o}[/i]`;if(S.b)o=`[b]${o}[/b]`;
  if(S.size)o=`[size=${S.size}]${o}[/size]`;if(S.font)o=`[font=${S.font}]${o}[/font]`;return o}
 if(f=='html'){let o=r.map(x=>{const t=esc(x.t).replace(/\n/g,'<br>');return x.c?`<span style="color:${x.c};">${t}</span>`:t}).join('');const c=styleCss();return c?`<span style="${c}">${o}</span>`:o}
 if(f=='css'){if(!['gradient','mirror','rainbow'].includes(S.effect))return'/* The CSS gradient export needs a smooth effect: Gradient, Middle gradient or Rainbow. */';
  const pts=S.effect=='rainbow'?[0,1,2,3,4,5,6].map(i=>hsl(i*60,1,.5)):S.effect=='mirror'?[...S.stops,...[...S.stops].reverse().slice(1)]:S.stops;
  return `<span style="background:linear-gradient(90deg,${pts.join(',')});-webkit-background-clip:text;background-clip:text;color:transparent;${styleCss()}">${esc(S.text).replace(/\n/g,'<br>')}</span>`}
 if(f=='ansi')return r.map(x=>x.c?x.t.replace(/\n/g,'\n').split('').map(c=>{const[a,b,d]=h2r(x.c);return c=='\n'?c:`\\x1b[${S.b?'1;':''}${S.i?'3;':''}${S.u?'4;':''}38;2;${a};${b};${d}m${c}\\x1b[0m`}).join(''):x.t).join('');
 return r.map(x=>x.c?Array.from(x.t).map(c=>`&#${x.c.slice(1)}${S.b?'&l':''}${S.i?'&o':''}${S.u?'&n':''}${S.s?'&m':''}${c}`).join(''):x.t).join('')}
function render(){
 const r=runs();$('#out').value=gen(r);
 $('#stage').innerHTML=r.map(x=>{const t=esc(x.t);return x.c?`<span style="color:${x.c}">${t}</span>`:t}).join('')||'<span style="opacity:.4">Type something…</span>';
 $('#stage').style.cssText=styleCss();$('#stage').className='stage '+(S.bg=='auto'?'':S.bg);
 $('#meta').textContent=`${Array.from(S.text).length} chars · ${$('#out').value.length} code chars`;
 $('#stopsBox').classList.toggle('hide',['random','rainbow'].includes(S.effect));
 $('#rerollBox').classList.toggle('hide',S.effect!='random');
 $('#add').classList.toggle('hide',S.effect=='solid');
 try{history.replaceState(null,'','#'+btoa(unescape(encodeURIComponent(JSON.stringify(S,['text','effect','stops','perWord','opt','font','size','b','i','u','s','fmt','bg','seed'])))))}catch(e){}}
function chips(el,name,map,key){$(el).innerHTML=Object.entries(map).map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}"${S[key]==v?' checked':''}><span>${l}</span></label>`).join('');
 $(el).onchange=e=>{S[key]=e.target.value;render()}}
function drawStops(){
 $('#stops').innerHTML=S.stops.map((c,i)=>`<div class="stop"><input type="color" value="${c}" data-i="${i}" aria-label="Color ${i+1}"><input type="text" value="${c}" data-i="${i}" maxlength="7" aria-label="Hex ${i+1}">${S.stops.length>2&&S.effect!='solid'?`<button data-x="${i}" aria-label="Remove">✕</button>`:''}</div>`).join('');
 $('#stops').querySelectorAll('input').forEach(el=>el.oninput=()=>{const v=el.value;if(/^#[0-9a-f]{6}$/i.test(v)){S.stops[el.dataset.i]=v.toUpperCase();el.parentNode.querySelectorAll('input').forEach(o=>{if(o!==el)o.value=v});render()}});
 $('#stops').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{S.stops.splice(b.dataset.x,1);drawStops();render()})}
function init(){
 try{Object.assign(S,JSON.parse(decodeURIComponent(escape(atob(location.hash.slice(1))))))}catch(e){}
 $('#text').value=S.text;$('#perWord').checked=S.perWord;$('#opt').checked=S.opt;
 $('#font').innerHTML=FONTS.map(f=>`<option value="${f}">${f||'Default font'}</option>`).join('');$('#font').value=S.font;
 $('#size').innerHTML=SIZES.map(f=>`<option value="${f}">${f?f+' px':'Default size'}</option>`).join('');$('#size').value=S.size;
 $('#styles').innerHTML=[['b','Bold'],['i','Italic'],['u','Underline'],['s','Strikethrough']].map(([k,l])=>`<label><input type="checkbox" data-k="${k}"${S[k]?' checked':''}><span>${l}</span></label>`).join('');
 $('#styles').onchange=e=>{S[e.target.dataset.k]=e.target.checked?1:0;render()};
 chips('#effects','fx',EFFECTS,'effect');chips('#fmts','fm',FORMATS,'fmt');chips('#bgs','bg',BGS,'bg');
 $('#presets').innerHTML=Object.entries(PRESETS).map(([n,c])=>`<button title="${n}" aria-label="${n}" style="background:linear-gradient(90deg,${c})"></button>`).join('');
 $('#presets').onclick=e=>{const b=e.target.closest('button');if(!b)return;S.stops=[...PRESETS[b.title]];if(S.effect=='random'||S.effect=='rainbow'||S.effect=='solid'){S.effect='gradient';chips('#effects','fx',EFFECTS,'effect')}drawStops();render()};
 $('#text').oninput=e=>{S.text=e.target.value;render()};
 $('#perWord').onchange=e=>{S.perWord=e.target.checked;render()};$('#opt').onchange=e=>{S.opt=e.target.checked;render()};
 $('#font').onchange=e=>{S.font=e.target.value;render()};$('#size').onchange=e=>{S.size=e.target.value;render()};
 $('#add').onclick=()=>{S.stops.push(r2h([Math.random()*255,Math.random()*255,Math.random()*255]));drawStops();render()};
 $('#rev').onclick=()=>{S.stops.reverse();drawStops();render()};
 $('#reroll').onclick=()=>{S.seed=Math.floor(Math.random()*1e9);render()};
 const cp=(txt,b,l)=>navigator.clipboard.writeText(txt).then(()=>{b.textContent='Copied!';setTimeout(()=>b.textContent=l,1200)});
 $('#copy').onclick=e=>cp($('#out').value,e.target,'Copy code');$('#share').onclick=e=>cp(location.href,e.target,'Copy share link');
 $('#theme').onclick=()=>{const d=document.documentElement;d.dataset.theme=d.dataset.theme=='dark'?'light':'dark'};
 if(matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.dataset.theme='dark';
 drawStops();render()}
init();
</script>
</body>
</html>
